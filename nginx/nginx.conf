events {}
http {
 resolver 127.0.0.11 valid=5s;
 server {
  listen 8080;
  location /api/v1/ { set $api http://backend:8080; proxy_pass $api; proxy_set_header Host $host; }
  location /admin/ { return 302 http://localhost:5173; }
  location / { set $public http://frontend:3000; proxy_pass $public; proxy_set_header Host $host; }
 }
}
