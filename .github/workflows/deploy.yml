name: Deploy demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-demo-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEMO_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      RENDER_URL: ${{ vars.RENDER_URL }}
      PUBLIC_DEMO_URL: ${{ vars.PUBLIC_DEMO_URL }}
      ADMIN_DEMO_URL: ${{ vars.ADMIN_DEMO_URL }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PUBLIC_PROJECT_ID: ${{ vars.VERCEL_PUBLIC_PROJECT_ID }}
      VERCEL_ADMIN_PROJECT_ID: ${{ vars.VERCEL_ADMIN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release revision and stage Vercel source
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for key in RENDER_URL PUBLIC_DEMO_URL ADMIN_DEMO_URL RENDER_SERVICE_ID VERCEL_ORG_ID VERCEL_PUBLIC_PROJECT_ID VERCEL_ADMIN_PROJECT_ID RENDER_API_KEY VERCEL_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "Missing $key in GitHub environment demo" >&2
              exit 1
            fi
          done
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
          mkdir "$RUNNER_TEMP/demo-source"
          git archive "$RELEASE_SHA" frontend admin | tar -x -C "$RUNNER_TEMP/demo-source"
          python3 scripts/demo_release.py prepare --root "$RUNNER_TEMP/demo-source"
      - name: Deploy and verify exact backend revision
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/demo_release.py render
      - name: Build both Vercel projects and promote them after checking main
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global vercel@66.6.0
          deploy_app() {
            export VERCEL_PROJECT_ID="$2"
            cd "$RUNNER_TEMP/demo-source/$1"
            vercel deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --meta "releaseSha=$RELEASE_SHA"
          }
          public="$(deploy_app frontend "$VERCEL_PUBLIC_PROJECT_ID")"
          admin="$(deploy_app admin "$VERCEL_ADMIN_PROJECT_ID")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
          test -n "$public"
          test -n "$admin"
          (cd "$RUNNER_TEMP/demo-source/frontend"; VERCEL_PROJECT_ID="$VERCEL_PUBLIC_PROJECT_ID" vercel promote "$public" --yes --token "$VERCEL_TOKEN")
          (cd "$RUNNER_TEMP/demo-source/admin"; VERCEL_PROJECT_ID="$VERCEL_ADMIN_PROJECT_ID" vercel promote "$admin" --yes --token "$VERCEL_TOKEN")
      - name: Verify stable demo URLs and private API behavior
        run: python3 scripts/demo_release.py smoke
