name: Deploy demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-demo-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Ensure all applications exist
        id: apps
        shell: bash
        run: |
          if [ -f frontend/package.json ] && [ -f admin/package.json ] && [ -f backend/go.mod ] && [ -f backend/Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Applications are not scaffolded; no deployment requested." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check deployment hooks
        if: steps.apps.outputs.ready == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_PUBLIC_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_PUBLIC_DEPLOY_HOOK_URL }}
          VERCEL_ADMIN_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_ADMIN_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for key in RENDER_DEPLOY_HOOK_URL VERCEL_PUBLIC_DEPLOY_HOOK_URL VERCEL_ADMIN_DEPLOY_HOOK_URL; do
            if [ -z "${!key}" ]; then
              echo "Missing $key in GitHub environment demo" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
      - name: Deploy backend first
        if: steps.apps.outputs.ready == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 -X POST "$DEPLOY_HOOK_URL" > /dev/null
      - name: Deploy public frontend
        if: steps.apps.outputs.ready == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_PUBLIC_DEPLOY_HOOK_URL }}
        shell: bash
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 -X POST "$DEPLOY_HOOK_URL" > /dev/null
      - name: Deploy admin frontend
        if: steps.apps.outputs.ready == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_ADMIN_DEPLOY_HOOK_URL }}
        shell: bash
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 -X POST "$DEPLOY_HOOK_URL" > /dev/null
      - name: Note deployment boundary
        if: steps.apps.outputs.ready == 'true'
        run: echo "Deploy hooks accepted the request. Verify provider build, migrations, readiness and URLs before considering deployment complete." >> "$GITHUB_STEP_SUMMARY"
