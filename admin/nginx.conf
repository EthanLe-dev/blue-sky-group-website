log_format safe_request '$remote_addr $request_method $uri $status';
server {
 listen 8080;
 access_log /var/log/nginx/access.log safe_request;
 error_log /var/log/nginx/error.log crit;
 location /api/v1/media/ { error_log /dev/null; set $api http://backend:8080; proxy_pass $api; proxy_set_header Host $host; }
 client_max_body_size 51m;
 resolver 127.0.0.11 valid=5s;
 root /usr/share/nginx/html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/v1/ { set $api http://backend:8080; proxy_pass $api; proxy_set_header Host $host; }
}
